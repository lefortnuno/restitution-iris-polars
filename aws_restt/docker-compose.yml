services:
  backendd:
    image: registry.gitlab.com/lefortnuno/restitution_iris/backend:latest
    container_name: restt-backend 
    command: >
      bash -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOW_ALL_ORIGINS: "True"
      DEBUG: "0"
      SECRET_KEY: "your-secret-key"
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_HOST: "dbb"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_RES_URL: "redis://redis:6379/1"
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - dbb
      - redis
    restart: always

  celery:
    image: registry.gitlab.com/lefortnuno/restitution_iris/backend:latest
    container_name: restt-celery 
    command: celery -A config worker -P solo -l info
    environment:
      DEBUG: "0"
      SECRET_KEY: "your-secret-key"
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_HOST: "dbb"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_RES_URL: "redis://redis:6379/1"
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - backendd
      - redis
    restart: always

  frontendd:
    image: registry.gitlab.com/lefortnuno/restitution_iris/frontend:latest
    container_name: restt-frontend 
    ports:
      - "5173:80"
    restart: always

  dbb:
    image: pgvector/pgvector:pg15
    container_name: restt-postgres 
    environment:
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: restt-redis 
    restart: always

  nginx:
      image: registry.gitlab.com/lefortnuno/restitution_iris/nginx:latest
      container_name: restt-nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro,Z
        - ./nginx/certs:/etc/nginx/certs:ro,Z
      depends_on:
        - frontendd
        - backendd 
      restart: unless-stopped
      
volumes:
  postgres_data: