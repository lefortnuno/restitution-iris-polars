services:
  backendd:
    build: ./api_restitution
    command: >
      bash -c " 
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./api_restitution:/app
      - ./api_restitution/media:/app/media
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOW_ALL_ORIGINS: True
      DEBUG: "1"
      SECRET_KEY: "your-secret-key"
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_HOST: "dbb"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_RES_URL: "redis://redis:6379/1"
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - dbb
      - redis
    restart: always

  celery:
    build: ./api_restitution
    command: celery -A config worker -P solo -l info
    volumes:
      - ./api_restitution:/app
    environment:
      DEBUG: "1"
      SECRET_KEY: "your-secret-key"
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_HOST: "dbb"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_RES_URL: "redis://redis:6379/1"
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - backendd
      - redis
    restart: always

  frontendd:
    build: ./restitution_ui
    ports:
      - "5173:80"
    environment:
      # - REACT_APP_API_BASE_URL=/backend/
      - REACT_APP_API_TOKEN=${REACT_APP_API_TOKEN}
    restart: always

  dbb:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: "iris_restitution"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  nginx:
    build: ./nginx
    container_name: restt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    depends_on:
      - frontendd
      - backendd
    restart: unless-stopped

volumes:
  postgres_data:
